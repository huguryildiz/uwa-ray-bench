<!DOCTYPE html>
<!-- ============================================================================
 BELLHOP3D REFERENCE PANEL  (uwa-ray-bench)
 -----------------------------------------------------------------------------
 Ground-truth panel for the 3D underwater acoustic ray-propagation benchmark.
 This is NOT a language-model output: it renders a precomputed genuine-3D
 BELLHOP3D solve. It uses the SHARED infra renderer (vanilla JS + raw WebGL) and
 is loaded by harness/index.html as the bottom-right reference iframe.

 Data contract (see docs/benchmark_spec.md "Reference implementation"):
   reference/data/<elev>x<azim>.bin  (25 snap-grid stops) + manifest.json
   .bin layout (little-endian):
     [4B "URB1"][u32 hdrLen][hdrLen JSON header]
     [NX*NY*NZ Float32 TL field, dB, x-fastest]
     per ray: [int32 npts][int16 npts*3 xyz quantized][float32 npts travel-time]
   Int16 dequant: coord = lo + ((q+32767)/65534)*(hi-lo)   (box in metres).

 Shared contract with the harness (postMessage, no network to parent):
   emits  : {type:'ray_metrics', panel:'reference', ...card, tl:Float32(101*49*31)}
            {type:'camera', pose}                (on local orbit, for sync)
            {type:'cursor_screen', nx,ny}         (hover readout)
            {type:'ready', panel:'reference'}
   accepts: {type:'set_camera', pose}  {type:'set_stop', elev,azim}
            {type:'play'} {type:'pause'} {type:'reset'}
            {type:'set_volume', on} {type:'set_opacity', v} {type:'request_metrics'}

 Scenario (analytic, identical for all panels):
   c(z): 0..200m  1520 - 0.10 z ;  z>200  1500 + 0.018 (z-200)   (min at 200 m)
   D(x,y) = 2500 - 1500*exp(-(((x-18)/2.5)^2+((y-12)/3)^2))
                 - 1900*exp(-(((x-34)/2.0)^2+((y-9)/2.5)^2))      (km in, m out)
   S=(0,12,50m)  R=(40,9,1000m)   domain x0..50km y0..24km z0..3000m (z down)
   Vertical exaggeration in the scene = 8x (documented; horizontal aspect kept).
============================================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BELLHOP3D Reference</title>
<style>
  @font-face{font-family:Newsreader;src:url(../fonts/newsreader-600.woff2) format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'IBM Plex Sans';src:url(../fonts/plexsans-400.woff2) format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url(../fonts/plexmono-400.woff2) format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url(../fonts/plexmono-500.woff2) format('woff2');font-weight:500;font-display:swap}
  :root{--glass:linear-gradient(160deg,rgba(20,26,60,.70),rgba(9,11,30,.80));
    --hair:rgba(100,140,255,.18);--cyan:#2dd4bf;--green:#39ff85;--ink:#e2e6f0;--muted:#7a82a6;
    --blur:blur(18px) saturate(140%);--fmono:'IBM Plex Mono','SF Mono',Menlo,monospace;
    --head:Newsreader,Georgia,serif}
  html,body{margin:0;height:100%;background:#06060f;overflow:hidden;
    font:12px/1.4 'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  #wrap{position:fixed;inset:0}
  #gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
  #gl{z-index:1} #ov{z-index:2;pointer-events:none}
  /* ---- floating panels: draggable + minimizable (xsect inset, legend, TL bar) ---- */
  .float-wrap{position:absolute;z-index:3;pointer-events:all;touch-action:none;cursor:grab}
  .float-wrap.dragging{cursor:grabbing}
  .float-min{position:absolute;top:4px;right:4px;z-index:4;pointer-events:all;
    background:rgba(20,35,62,.5);color:var(--muted);border:1px solid var(--hair);
    border-radius:6px;width:17px;height:17px;padding:0;font-size:10px;font-weight:600;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .float-min:hover{border-color:rgba(150,210,255,.34);color:var(--ink)}
  .float-wrap.collapsed{width:auto!important;height:auto!important}
  .float-wrap.collapsed>*:not(.float-min){display:none}
  .float-wrap.collapsed .float-min{position:static;width:auto;height:20px;padding:0 8px;
    font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;border-radius:8px;
    background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}

  #xsect-wrap{left:10px;bottom:46px;width:196px;height:119px}

    border-radius:10px;background:rgba(9,11,30,.75);border:1px solid var(--hair);

  #legend-wrap{left:10px;bottom:175px}

  #legend .lg-row{display:flex;align-items:center;gap:8px;padding:3px 0;white-space:nowrap}

  #tlbar-wrap{right:16px;top:70px}

  #tlbar-inner .tl-side{writing-mode:vertical-rl;transform:rotate(180deg);
    font:11px -apple-system,sans-serif;color:#cfe3ff}

  /* ---- DRAWER (B): right-edge metrics panel ---- */
  #drawer{position:absolute;right:0;top:0;bottom:38px;z-index:3;
    display:flex;flex-direction:row-reverse;pointer-events:none}
  #drawer-tab{width:28px;background:var(--glass);border-left:1px solid var(--hair);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;pointer-events:all;writing-mode:vertical-rl;
    text-orientation:mixed;transform:rotate(180deg);
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);
    user-select:none;transition:background .15s;
    box-shadow:-4px 0 16px -4px rgba(0,0,0,.4)}
  #drawer-tab:hover{background:linear-gradient(160deg,rgba(30,40,80,.88),rgba(15,18,50,.92))}
  #drawer-panel{width:0;overflow:hidden;
    background:var(--glass);border-left:1px solid var(--hair);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:-8px 0 30px -8px rgba(0,0,0,.5);
    transition:width .22s cubic-bezier(.4,0,.2,1);
    pointer-events:all;display:flex;flex-direction:column}
  #drawer.open #drawer-panel{width:210px}
  #drawer-head{display:flex;align-items:center;justify-content:space-between;
    padding:11px 13px 8px;border-bottom:1px solid var(--hair);flex-shrink:0}
  #drawer-head h4{margin:0;font-size:8.5px;color:var(--cyan);letter-spacing:.2em;text-transform:uppercase}
  #drawer-close{background:rgba(20,35,62,.5);color:var(--muted);border:1px solid var(--hair);
    border-radius:7px;width:21px;height:21px;padding:0;font-size:11px;font-weight:600;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  #drawer-close:hover{border-color:rgba(150,210,255,.34);color:var(--ink)}
  #cardbody-wrap{padding:10px 13px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:rgba(100,140,255,.25) transparent}
  #cardbody-wrap::-webkit-scrollbar{width:4px}
  #cardbody-wrap::-webkit-scrollbar-track{background:transparent}
  #cardbody-wrap::-webkit-scrollbar-thumb{background:rgba(100,140,255,.25);border-radius:4px}
  #cardbody-wrap::-webkit-scrollbar-thumb:hover{background:rgba(100,140,255,.45)}
  /* KPI tiles (generated by refreshCard into #cardbody) */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .kpi{background:rgba(255,255,255,.035);border:1px solid rgba(150,180,255,.10);
    border-radius:9px;padding:7px 9px 8px;display:flex;flex-direction:column;gap:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .kpi .k{font-size:7.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:var(--fmono);font-variant-numeric:tabular-nums;
    font-size:16px;font-weight:600;color:#eaf3ff;line-height:1;white-space:nowrap}
  .kpi .u{font-size:9px;color:var(--muted);font-weight:400;letter-spacing:.02em}
  .status{margin-top:8px;text-align:center;font-family:var(--fmono);font-size:9.5px;
    letter-spacing:.04em;padding:5px 8px;border-radius:8px;border:1px solid transparent}
  .status.ok{color:#39d98a;background:rgba(57,217,138,.08);border-color:rgba(57,217,138,.22)}
  .status.flag{color:#ffb867;background:rgba(255,184,103,.08);border-color:rgba(255,184,103,.24)}

  /* ---- DOCK BAR (A): bottom control strip ---- */
  #dock{position:absolute;left:0;right:28px;bottom:0;z-index:3;height:38px;
    display:flex;align-items:center;gap:5px;padding:0 10px;
    background:var(--glass);border-top:1px solid var(--hair);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:0 -6px 24px -8px rgba(0,0,0,.5)}
  #dock button{background:rgba(20,35,62,.5);color:var(--ink);border:1px solid var(--hair);
    border-radius:7px;padding:0 9px;height:24px;font-size:12px;font-weight:600;
    cursor:pointer;transition:.15s;white-space:nowrap;display:flex;align-items:center}
  #dock button:hover{border-color:rgba(150,210,255,.34);transform:translateY(-1px)}
  #dock .sep{width:1px;height:18px;background:var(--hair);flex-shrink:0;margin:0 2px}
  #dock #scrub{flex:1;min-width:60px}
  #dock select{background:rgba(20,35,62,.5);color:var(--ink);border:1px solid var(--hair);
    border-radius:7px;padding:0 4px;font-size:11px;cursor:pointer;height:24px}
  #dock .lbl{color:var(--muted);font-size:10px;white-space:nowrap}
  #dock .vol-lbl{color:var(--muted);font-size:10px;display:flex;align-items:center;gap:3px;white-space:nowrap}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#2bb8e8,#5fe3ff);vertical-align:middle}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#eafaff;box-shadow:0 0 9px rgba(95,227,255,.9);cursor:pointer}
  input[type=checkbox]{accent-color:var(--cyan)}
  #dock #speed{width:58px}
  #dock #opac{width:52px}
  #loading{position:absolute;inset:0;z-index:4;display:flex;align-items:center;
    justify-content:center;background:#04080f;color:var(--cyan);font-size:13px;letter-spacing:.04em}
  @media (max-width:460px){
    #dock{gap:4px;padding:0 8px;right:0}
    #dock .lbl,#dock .sep,#dock #camreset,#dock #speed,#dock #opac{display:none}
    #dock .vol-lbl{gap:4px}
    #dock #scrub{min-width:50px}
    #dock select{font-size:10px;padding:0 2px}
    #drawer-tab{font-size:7px;letter-spacing:.12em}

</style>

<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
  <div id="xsect-wrap" class="float-wrap">
    <canvas id="xsect"></canvas>
    <button class="float-min" title="Minimize">–</button>
  </div>
  <div id="legend-wrap" class="float-wrap">
    <div id="legend">
      <div class="lg-row"><span class="lg-sw" style="background:#ffd36b"></span>source S</div>
      <div class="lg-row"><span class="lg-sw" style="background:#9fe8ff"></span>receiver R</div>
      <div class="lg-row"><span class="lg-sw" style="background:#b08c5a"></span>seabed / seamounts</div>
      <div class="lg-row"><span class="lg-sw" style="background:#6cf"></span>rays (by launch angle)</div>
      <div class="lg-row"><span class="lg-sw" style="background:#2aa0d0"></span>insonified TL volume</div>
    </div>
    <button class="float-min" title="Minimize">–</button>
  </div>
  <div id="tlbar-wrap" class="float-wrap">
    <div id="tlbar-inner">
      <div class="tl-col"><span>115</span><canvas id="tlbar" width="12" height="150"></canvas><span>45 dB</span></div>
      <span class="tl-side">TL (dB)</span>
    </div>
    <button class="float-min" title="Minimize">–</button>
  </div>
  <!-- B: right-edge metrics drawer -->
  <div id="drawer">
    <div id="drawer-tab">METRICS</div>
    <div id="drawer-panel">
      <div id="drawer-head"><h4>REFERENCE METRICS</h4>
        <button id="drawer-close" title="Close">✕</button></div>
      <div id="cardbody-wrap"><div id="cardbody">…</div></div>
    </div>
  </div>
  <!-- A: bottom dock bar -->
  <div id="dock">
    <button id="play">▶ Play</button>
    <button id="reset">⟲ Reset</button>
    <button id="camreset">⌖ Cam</button>
    <div class="sep"></div>
    <span class="lbl">fan</span>
    <select id="elevsel"></select><span class="lbl">×</span><select id="azimsel"></select>
    <div class="sep"></div>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <div class="sep"></div>
    <span class="lbl">spd</span><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
    <div class="sep"></div>
    <label class="vol-lbl"><input id="volchk" type="checkbox" checked>TL</label>
    <span class="lbl">α</span><input id="opac" type="range" min="0" max="1" step="0.02" value="0.5">
  </div>
  <div id="loading">loading reference…</div>
</div>
<script>
"use strict";
/* ========================= scenario constants ========================= */
const X_MAX=50, Y_MAX=24, Z_MAX=3000;          // km, km, m
const SRC={x:0,y:12,z:50}, RCV={x:40,y:9,z:1000};
const NX=101, NY=49, NZ=31, TL_SHADOW=120;
const VEXAG=8, S=2/X_MAX;                       // scene scale: range -> [-1,1]
function soundSpeed(z){return z<=200?1520-0.10*z:1500+0.018*(z-200);}
function bathy(xk,yk){return 2500
  -1500*Math.exp(-((((xk-18)/2.5)**2)+(((yk-12)/3.0)**2)))
  -1900*Math.exp(-((((xk-34)/2.0)**2)+(((yk-9)/2.5)**2)));}
// world (x km, y km, z m, z down) -> scene (X range, Y up, Z cross-range)
function toScene(xk,yk,zm){return [ (xk-X_MAX/2)*S, (Z_MAX/2-zm)*S*VEXAG/1000, (yk-Y_MAX/2)*S ];}

/* ========================= tiny mat4 ========================= */
const M={
  mul(a,b){const o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  persp(fov,asp,n,f){const t=1/Math.tan(fov/2),o=new Float32Array(16);
    o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  lookAt(e,c,up){const z=norm(sub(e,c)),x=norm(cross(up,z)),y=cross(z,x);
    return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
      -dot(x,e),-dot(y,e),-dot(z,e),1]);},
  invert(m){const i=new Float32Array(16),a=m;
    i[0]=a[5]*a[10]*a[15]-a[5]*a[11]*a[14]-a[9]*a[6]*a[15]+a[9]*a[7]*a[14]+a[13]*a[6]*a[11]-a[13]*a[7]*a[10];
    i[4]=-a[4]*a[10]*a[15]+a[4]*a[11]*a[14]+a[8]*a[6]*a[15]-a[8]*a[7]*a[14]-a[12]*a[6]*a[11]+a[12]*a[7]*a[10];
    i[8]=a[4]*a[9]*a[15]-a[4]*a[11]*a[13]-a[8]*a[5]*a[15]+a[8]*a[7]*a[13]+a[12]*a[5]*a[11]-a[12]*a[7]*a[9];
    i[12]=-a[4]*a[9]*a[14]+a[4]*a[10]*a[13]+a[8]*a[5]*a[14]-a[8]*a[6]*a[13]-a[12]*a[5]*a[10]+a[12]*a[6]*a[9];
    i[1]=-a[1]*a[10]*a[15]+a[1]*a[11]*a[14]+a[9]*a[2]*a[15]-a[9]*a[3]*a[14]-a[13]*a[2]*a[11]+a[13]*a[3]*a[10];
    i[5]=a[0]*a[10]*a[15]-a[0]*a[11]*a[14]-a[8]*a[2]*a[15]+a[8]*a[3]*a[14]+a[12]*a[2]*a[11]-a[12]*a[3]*a[10];
    i[9]=-a[0]*a[9]*a[15]+a[0]*a[11]*a[13]+a[8]*a[1]*a[15]-a[8]*a[3]*a[13]-a[12]*a[1]*a[11]+a[12]*a[3]*a[9];
    i[13]=a[0]*a[9]*a[14]-a[0]*a[10]*a[13]-a[8]*a[1]*a[14]+a[8]*a[2]*a[13]+a[12]*a[1]*a[10]-a[12]*a[2]*a[9];
    i[2]=a[1]*a[6]*a[15]-a[1]*a[7]*a[14]-a[5]*a[2]*a[15]+a[5]*a[3]*a[14]+a[13]*a[2]*a[7]-a[13]*a[3]*a[6];
    i[6]=-a[0]*a[6]*a[15]+a[0]*a[7]*a[14]+a[4]*a[2]*a[15]-a[4]*a[3]*a[14]-a[12]*a[2]*a[7]+a[12]*a[3]*a[6];
    i[10]=a[0]*a[5]*a[15]-a[0]*a[7]*a[13]-a[4]*a[1]*a[15]+a[4]*a[3]*a[13]+a[12]*a[1]*a[7]-a[12]*a[3]*a[5];
    i[14]=-a[0]*a[5]*a[14]+a[0]*a[6]*a[13]+a[4]*a[1]*a[14]-a[4]*a[2]*a[13]-a[12]*a[1]*a[6]+a[12]*a[2]*a[5];
    i[3]=-a[1]*a[6]*a[11]+a[1]*a[7]*a[10]+a[5]*a[2]*a[11]-a[5]*a[3]*a[10]-a[9]*a[2]*a[7]+a[9]*a[3]*a[6];
    i[7]=a[0]*a[6]*a[11]-a[0]*a[7]*a[10]-a[4]*a[2]*a[11]+a[4]*a[3]*a[10]+a[8]*a[2]*a[7]-a[8]*a[3]*a[6];
    i[11]=-a[0]*a[5]*a[11]+a[0]*a[7]*a[9]+a[4]*a[1]*a[11]-a[4]*a[3]*a[9]-a[8]*a[1]*a[7]+a[8]*a[3]*a[5];
    i[15]=a[0]*a[5]*a[10]-a[0]*a[6]*a[9]-a[4]*a[1]*a[10]+a[4]*a[2]*a[9]+a[8]*a[1]*a[6]-a[8]*a[2]*a[5];
    let det=a[0]*i[0]+a[1]*i[4]+a[2]*i[8]+a[3]*i[12]; if(!det)return null; det=1/det;
    for(let k=0;k<16;k++)i[k]*=det; return i;}
};
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];}

/* ========================= GL setup ========================= */
const glc=document.getElementById('gl'), ov=document.getElementById('ov'),
      octx=ov.getContext('2d');
const gl=glc.getContext('webgl',{antialias:true,alpha:false});
if(!gl){document.getElementById('loading').textContent='WebGL unavailable';}
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
function prog(vs,fs){const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);
  return p;}

// flat colored (box, surface plane, S/R markers) — per-vertex color, uniform alpha
const pFlat=prog(
 `attribute vec3 a_pos;attribute vec3 a_col;uniform mat4 u_mvp;uniform float u_psize;
  varying vec3 v_col;void main(){gl_Position=u_mvp*vec4(a_pos,1.);v_col=a_col;gl_PointSize=u_psize;}`,
 `precision mediump float;varying vec3 v_col;uniform float u_alpha;uniform float u_round;
  void main(){if(u_round>.5){vec2 d=gl_PointCoord-vec2(.5);if(dot(d,d)>.25)discard;}
   gl_FragColor=vec4(v_col,u_alpha);}`);
// lit seabed surface
const pSurf=prog(
 `attribute vec3 a_pos;attribute vec3 a_nrm;uniform mat4 u_mvp;
  varying vec3 v_n;varying float v_d;void main(){gl_Position=u_mvp*vec4(a_pos,1.);
   v_n=a_nrm;v_d=a_pos.y;}`,
 `precision mediump float;varying vec3 v_n;varying float v_d;
  void main(){vec3 n=normalize(v_n);vec3 L=normalize(vec3(.4,.9,.5));
   float dif=max(dot(n,L),0.);float rim=pow(1.-abs(n.y),2.);
   vec3 base=mix(vec3(.36,.30,.20),vec3(.62,.55,.34),clamp(v_d*2.+.5,0.,1.));

// faint surface plane z=0

  const tr=[0,1,2,0,2,3],a=[];for(const i of tr){const s=toScene(...p[i]);

const seabed=(()=>{const gx=120,gy=64,verts=[];
  const P=(i,j)=>{const xk=i/gx*X_MAX, yk=j/gy*Y_MAX; return toScene(xk,yk,bathy(xk,yk));};
  function nrm(i,j){const e=1e-3;const xk=i/gx*X_MAX,yk=j/gy*Y_MAX;

/* ========================= per-stop dynamic geometry ========================= */

// Pure decode: bytes -> transferable TypedArrays. No DOM/GL, so it runs identically on
// the main thread (fallback) and inside the Blob worker (built from this function's source).
// TL field is a verbatim byte slice, so it is bit-identical regardless of where it decodes.
function decodeStop(buffer){
  const dv=new DataView(buffer);
  if(String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3))!=='URB1')
    throw 'bad magic';

  const hdr=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,off,hdrLen)));

  const q=hdr.quant_box_m, deq=(v,lo,hi)=>lo+((v+32767)/65534)*(hi-lo);

  const nr=hdr.n_rays; const pos=[],col=[],tim=[],xzSegs=[]; let tMax=1;

    const xs=new Array(npts),ys=new Array(npts),zs=new Array(npts);
    const xw=new Array(npts),zw=new Array(npts); // world km / m for cross-section
    for(let p=0;p<npts;p++){
      const qx=dv.getInt16(off,true),qy=dv.getInt16(off+2,true),qz=dv.getInt16(off+4,true);off+=6;
      const xm=deq(qx,q.xmin,q.xmax),ym=deq(qy,q.ymin,q.ymax),zm=deq(qz,q.zmin,q.zmax);
      const sc=toScene(xm/1000,ym/1000,zm); xs[p]=sc[0];ys[p]=sc[1];zs[p]=sc[2];
      xw[p]=xm/1000; zw[p]=zm;}
    const ts=new Float32Array(npts);
    for(let p=0;p<npts;p++){ts[p]=dv.getFloat32(off,true);off+=4;}
    const c=hueRGB(0.75*r/Math.max(1,nr-1)); // launch-angle rainbow (index proxy)
    for(let p=0;p<npts-1;p++){
      pos.push(xs[p],ys[p],zs[p], xs[p+1],ys[p+1],zs[p+1]);
      col.push(c[0],c[1],c[2],c[0],c[1],c[2]); tim.push(ts[p],ts[p+1]);
      xzSegs.push(xw[p],zw[p],xw[p+1],zw[p+1],ts[p],ts[p+1],c[0],c[1],c[2]);}

    rayTim:new Float32Array(tim), rayN:tim.length, rayXZ:new Float32Array(xzSegs),
    volPos:new Float32Array(vp), volCol:new Float32Array(vc), volN:vp.length/3,

let decodeWorker=null, decodeSeq=0; const decodePending=new Map();

    `const X_MAX=${X_MAX},Y_MAX=${Y_MAX},Z_MAX=${Z_MAX},VEXAG=${VEXAG},S=${S},TL_SHADOW=${TL_SHADOW};\n`+
    toScene.toString()+"\n"+hueRGB.toString()+"\n"+tlColor.toString()+"\n"+decodeStop.toString()+"\n"+
    "onmessage=function(e){var id=e.data.id,buffer=e.data.buffer,r;"+
    "try{r=decodeStop(buffer);}catch(err){postMessage({id:id,error:String(err)});return;}"+
    "postMessage({id:id,rayPos:r.rayPos,rayCol:r.rayCol,rayTim:r.rayTim,rayN:r.rayN,rayXZ:r.rayXZ,"+
    "volPos:r.volPos,volCol:r.volCol,volN:r.volN,tlField:r.tlField,tMax:r.tMax,nr:r.nr,insFrac:r.insFrac,hdr:r.hdr},"+

/* ========================= camera ========================= */
let cam={yaw:1.0, pitch:0.72, dist:3.3}, mvp=new Float32Array(16);
function camDefault(){cam={yaw:1.0,pitch:0.72,dist:3.3};}
function updateMVP(){
  const asp=glc.width/glc.height;
  const eye=[cam.dist*Math.cos(cam.pitch)*Math.cos(cam.yaw),
            cam.dist*Math.sin(cam.pitch),
            cam.dist*Math.cos(cam.pitch)*Math.sin(cam.yaw)];

function project(sx,sy,sz){const x=mvp[0]*sx+mvp[4]*sy+mvp[8]*sz+mvp[12],

  if(w<=0)return null;return{x:(x/w*.5+.5)*ov.width/dpr,y:(1-(y/w*.5+.5))*ov.height/dpr};}

/* ========================= draw ========================= */

function markDirty(){ dirty=true; schedule(); }
function frame(now){

  if(!(dt>0)) dt=0; else if(dt>0.05) dt=0.05;   // clamp resume gaps; steady frames unaffected

    document.getElementById('scrub').value=Math.min(1,curTime/(tMax*1.25)); dirty=true;}

}
function render(){

/* ========================= centerline cross-section inset ========================= */
// clip segment against bathy(x,12) floor; binary-search for intersection (time-independent)
function clipSeg(x1,z1,x2,z2){
  const b1=bathy(x1,12),b2=bathy(x2,12);
  const u1=z1>=b1,u2=z2>=b2;
  if(u1&&u2) return null;
  if(!u1&&!u2) return [x1,z1,x2,z2];
  let ta=0,tb=1;
  for(let k=0;k<10;k++){const tm=(ta+tb)/2,xm=x1+tm*(x2-x1),zm=z1+tm*(z2-z1);
    if(zm>=bathy(xm,12)) tb=tm; else ta=tm;}
  const tc=(ta+tb)/2,xc=x1+tc*(x2-x1),zc=z1+tc*(z2-z1);
  return u1?[xc,zc,x2,z2]:[x1,z1,xc,zc];

// WP3: cache the clipped polyline once per stop (clip is time-independent); only the

let xsectSegs=null, xsectLastTime=-1, xsectDirty=true;

      const seg=clipSeg(rayXZ[o],rayXZ[o+1],rayXZ[o+2],rayXZ[o+3]);
      if(!seg) continue;
      xsectSegs.push({x1:seg[0],z1:seg[1],x2:seg[2],z2:seg[3],
        t1:rayXZ[o+4],t2:rayXZ[o+5],

  }

function drawXSection(){

  xsectLastTime=curTime; xsectDirty=false;

  const W=xc.width, H=xc.height;

  const PAD={l:34,r:6,t:34,b:22};

  // ray segments (animated: show cached clipped segments whose t1 <= curTime)
  if(xsectSegs){
    for(let i=0;i<xsectSegs.length;i++){
      const s=xsectSegs[i];
      if(s.t1>curTime) continue;
      const alpha=s.t2<=curTime?0.45:0.75;
      ctx.strokeStyle=`rgba(${s.r},${s.g},${s.b},${alpha})`;
      ctx.lineWidth=0.65;
      ctx.beginPath(); ctx.moveTo(cx(s.x1),cz(s.z1)); ctx.lineTo(cx(s.x2),cz(s.z2)); ctx.stroke();
    }
  }
  // axes
  ctx.strokeStyle='rgba(155,182,216,.35)'; ctx.lineWidth=0.7;
  ctx.beginPath();
  ctx.moveTo(PAD.l,PAD.t); ctx.lineTo(PAD.l,PAD.t+ph);
  ctx.moveTo(PAD.l,PAD.t+ph); ctx.lineTo(PAD.l+pw,PAD.t+ph);
  ctx.stroke();
  // tick labels
  ctx.fillStyle='rgba(155,182,216,.55)'; ctx.font='7.5px "IBM Plex Mono",monospace';
  ctx.textAlign='center';
  [0,10,20,30,40,50].forEach(xk=>ctx.fillText(xk,cx(xk),PAD.t+ph+10));
  ctx.fillText('range (km)',PAD.l+pw/2,PAD.t+ph+20);
  ctx.textAlign='right';
  [0,1000,2000,3000].forEach(zm=>ctx.fillText(zm?zm/1000+'k':0,PAD.l-3,cz(zm)+3));
  // S marker
  ctx.fillStyle='#ffd36b'; ctx.textAlign='center'; ctx.font='bold 9px sans-serif';
  ctx.beginPath(); ctx.arc(cx(SRC.x),cz(SRC.z),2.5,0,7); ctx.fill();
  ctx.fillText('S',cx(SRC.x),cz(SRC.z)-5);
  // R marker
  ctx.fillStyle='#9fe8ff';
  ctx.beginPath(); ctx.arc(cx(RCV.x),cz(RCV.z),2.5,0,7); ctx.fill();
  ctx.fillText('R',cx(RCV.x),cz(RCV.z)-5);
}

/* ========================= sizing ========================= */
let dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);
  const w=glc.clientWidth,h=glc.clientHeight;
  const W=w*dpr|0,H=h*dpr|0;
  if(glc.width!==W||glc.height!==H){glc.width=W;glc.height=H;ov.width=W;ov.height=H;overlayDirty=true;}}

/* ========================= metric card + postMessage ========================= */
let stopSummary=null, manifest=null, curStop={elev:41,azim:31};
function refreshCard(){
  if(!stopSummary)return;
  const off=!(curStop.elev===41&&curStop.azim===31);
  const reached=stopSummary.tl_R_dB<TL_SHADOW;
  document.getElementById('cardbody').innerHTML=
   `<div class="kpis">`+
   kpi('R reached', reached?'YES':'NO', '', reached?'#39d98a':'#ff5a5a')+
   kpi('TL(R)', stopSummary.tl_R_dB.toFixed(1), 'dB')+
   kpi('insonified', (stopSummary.insonified_frac*100).toFixed(1)+'%')+
   kpi('shadow', ((1-stopSummary.insonified_frac)*100).toFixed(1)+'%')+
   kpi('rays', stopSummary.n_rays, `${curStop.elev}×${curStop.azim}`)+
   kpi('freq', manifest.freq_hz, 'Hz')+
   kpi('FPS', fps.toFixed(0))+
   `</div>`+
   (off?`<div class="status flag">⚠ off-canonical (41×31)</div>`:
        `<div class="status ok">✓ canonical 41×31</div>`);
}
function kpi(k,v,u='',color=''){return `<div class="kpi"><span class="k">${k}</span>`+
  `<span class="v"${color?` style="color:${color}"`:''}>${v}`+
  (u?` <span class="u">${u}</span>`:'')+`</span></div>`;}
function postMetrics(){
  if(!stopSummary||!tlField)return;
  parent.postMessage({type:'ray_metrics', panel:'reference', label:'BELLHOP3D',
    canonical:(curStop.elev===41&&curStop.azim===31),
    stop:`${curStop.elev}x${curStop.azim}`,
    reached:stopSummary.tl_R_dB<TL_SHADOW, tl_R:stopSummary.tl_R_dB,
    insonified:stopSummary.insonified_frac, shadow:1-stopSummary.insonified_frac,
    n_rays:stopSummary.n_rays, freq:manifest.freq_hz,
    reciprocity:0, conv_ins:0, conv_tlR:0, out_of_plane:null,
    fps:Math.round(fps), is_reference:true,
    tl:tlField}, '*');   /* WP1: send the Float32Array directly (structured clone) — no Array.from boxing */
}

/* ========================= data loading ========================= */
async function loadManifest(){manifest=await (await fetch('data/manifest.json')).json();
  const es=document.getElementById('elevsel'),as=document.getElementById('azimsel');
  manifest.elev_stops.forEach(v=>es.add(new Option(v,v)));
  manifest.azim_stops.forEach(v=>as.add(new Option(v,v)));
  es.value=41; as.value=31;}
async function loadStop(elev,azim){
  document.getElementById('loading').style.display='flex';
  curStop={elev:+elev,azim:+azim};
  document.getElementById('elevsel').value=elev; document.getElementById('azimsel').value=azim;
  stopSummary=manifest.stops.find(s=>s.stop===`${elev}x${azim}`);
  const ab=await (await fetch(`data/${elev}x${azim}.bin`)).arrayBuffer();
  await buildStopAsync(ab);   // WP3: decode off the main thread, transfer buffers back
  curTime=0; document.getElementById('scrub').value=0;
  document.getElementById('loading').style.display='none';
  refreshCard(); postMetrics();
  overlayDirty=true; markDirty();   // WP3: new geometry -> render once
}

/* ========================= interaction ========================= */
let drag=false,lx=0,ly=0;
glc.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
function unprojectCursor(px,py){ // px,py in CSS px -> world (x_km,z_m) on centerline plane y=12km
  const inv=M.invert(mvp); if(!inv)return null;
  const ndcx=px/glc.clientWidth*2-1, ndcy=1-py/glc.clientHeight*2;
  const un=(z)=>{const x=inv[0]*ndcx+inv[4]*ndcy+inv[8]*z+inv[12],
    y=inv[1]*ndcx+inv[5]*ndcy+inv[9]*z+inv[13],
    zz=inv[2]*ndcx+inv[6]*ndcy+inv[10]*z+inv[14],
    w=inv[3]*ndcx+inv[7]*ndcy+inv[11]*z+inv[15];return [x/w,y/w,zz/w];};
  const a=un(-1),b=un(1);                                   // near/far on world ray
  const dz=b[2]-a[2]; if(Math.abs(dz)<1e-9)return null;
  const t=(0-a[2])/dz;                                      // intersect scene Z=0 (y=12km)
  const sx=a[0]+t*(b[0]-a[0]), sy=a[1]+t*(b[1]-a[1]);
  const xk=sx/S+X_MAX/2, zm=Z_MAX/2-sy/(S*VEXAG/1000);
  if(xk<-2||xk>X_MAX+2||zm<-50||zm>Z_MAX+50)return null;
  return {x_km:Math.max(0,Math.min(X_MAX,xk)), y_km:12, z_m:Math.max(0,Math.min(Z_MAX,zm))};}
addEventListener('pointermove',e=>{
  if(!drag){const w=unprojectCursor(e.clientX,e.clientY);
    if(w)parent.postMessage({type:'cursor',panel:'reference',...w},'*');
    else parent.postMessage({type:'cursor',panel:'reference',clear:true},'*');return;}
  cam.yaw-=(e.clientX-lx)*0.008; cam.pitch+=(e.clientY-ly)*0.008;
  cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch)); lx=e.clientX;ly=e.clientY;
  parent.postMessage({type:'camera',pose:cam},'*'); overlayDirty=true; markDirty();});
glc.addEventListener('wheel',e=>{e.preventDefault();
  cam.dist=Math.max(1.2,Math.min(9,cam.dist*(1+Math.sign(e.deltaY)*0.08)));
  parent.postMessage({type:'camera',pose:cam},'*'); overlayDirty=true; markDirty();},{passive:false});
document.getElementById('play').onclick=()=>{playing=!playing;
  document.getElementById('play').textContent=playing?'❚❚ Pause':'▶ Play'; markDirty();};
document.getElementById('reset').onclick=()=>{playing=false;curTime=0;
  document.getElementById('play').textContent='▶ Play';document.getElementById('scrub').value=0; markDirty();};
document.getElementById('camreset').onclick=()=>{camDefault(); overlayDirty=true; markDirty();};
document.getElementById('elevsel').onchange=e=>loadStop(e.target.value,curStop.azim);
document.getElementById('azimsel').onchange=e=>loadStop(curStop.elev,e.target.value);
document.getElementById('speed').oninput=e=>speed=+e.target.value;
document.getElementById('scrub').oninput=e=>{playing=false;
  document.getElementById('play').textContent='▶ Play';curTime=+e.target.value*tMax*1.25; markDirty();};
document.getElementById('volchk').onchange=e=>{showVol=e.target.checked; overlayDirty=true; markDirty(); updateTLBarVisibility();};
document.getElementById('opac').oninput=e=>{volOp=+e.target.value; markDirty();};
function toggleDrawer(){document.getElementById('drawer').classList.toggle('open');}
document.getElementById('drawer-tab').onclick=toggleDrawer;
document.getElementById('drawer-close').onclick=toggleDrawer;

/* ========================= floating panels: TL bar, drag, minimize ========================= */
function updateTLBarVisibility(){document.getElementById('tlbar-wrap').style.display=showVol?'':'none';}
function drawTLBarCanvas(){
  const c=document.getElementById('tlbar'), tctx=c.getContext('2d'), bh=c.height;
  for(let y=0;y<bh;y++){const tl=115-(y/bh)*70,col=tlColor(tl);
    tctx.fillStyle=`rgb(${col.map(v=>v*255|0).join(',')})`; tctx.fillRect(0,y,c.width,1);}
}
function makeDraggable(el){
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.float-min'))return;
    e.preventDefault();
    const rect=el.getBoundingClientRect(), parentRect=el.offsetParent.getBoundingClientRect();
    el.style.left=(rect.left-parentRect.left)+'px'; el.style.top=(rect.top-parentRect.top)+'px';
    el.style.right='auto'; el.style.bottom='auto';
    const sx=e.clientX, sy=e.clientY, ol=parseFloat(el.style.left), ot=parseFloat(el.style.top);
    el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
    function onMove(e2){el.style.left=(ol+e2.clientX-sx)+'px'; el.style.top=(ot+e2.clientY-sy)+'px';}
    function onUp(){el.classList.remove('dragging');
      el.removeEventListener('pointermove',onMove); el.removeEventListener('pointerup',onUp);}
    el.addEventListener('pointermove',onMove); el.addEventListener('pointerup',onUp);
  });
}
document.querySelectorAll('.float-wrap').forEach(makeDraggable);
document.querySelectorAll('.float-min').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();
  const collapsed=btn.closest('.float-wrap').classList.toggle('collapsed');
  btn.textContent=collapsed?'⤢':'–'; btn.title=collapsed?'Expand':'Minimize';};});

/* ========================= parent messages ========================= */
addEventListener('message',e=>{const m=e.data||{};switch(m.type){
  case'set_camera': if(m.pose){cam.yaw=m.pose.yaw;cam.pitch=m.pose.pitch;cam.dist=m.pose.dist;} overlayDirty=true;markDirty();break;
  case'set_stop': loadStop(m.elev,m.azim);break;
  case'play': playing=true;document.getElementById('play').textContent='❚❚ Pause';markDirty();break;
  case'pause': playing=false;document.getElementById('play').textContent='▶ Play';markDirty();break;
  case'reset': playing=false;curTime=0;document.getElementById('play').textContent='▶ Play';markDirty();break;
  case'set_volume': showVol=!!m.on;document.getElementById('volchk').checked=showVol;overlayDirty=true;markDirty();updateTLBarVisibility();break;
  case'set_opacity': volOp=+m.v;document.getElementById('opac').value=volOp;markDirty();break;
  case'set_speed': speed=Math.max(0.25,Math.min(4,+m.speed||1));document.getElementById('speed').value=speed;break;
  case'set_time': playing=false;curTime=Math.max(0,Math.min(1,+m.t||0))*tMax*1.25;
    document.getElementById('play').textContent='▶ Play';
    document.getElementById('scrub').value=Math.min(1,curTime/(tMax*1.25));markDirty();break;
  case'request_metrics': postMetrics();break;
  case'hide_controls': ['#dock','#drawer-tab'].forEach(s=>document.querySelectorAll(s).forEach(el=>el.style.display='none'));break;
}});

/* ========================= boot ========================= */
(async()=>{ try{
  // fix xsect canvas backing-store size (CSS handles display size)
  const xc=document.getElementById('xsect'); xc.width=196; xc.height=119;
  drawTLBarCanvas(); updateTLBarVisibility();
  await loadManifest();
  await loadStop(41,31);
  // drawer starts closed; dock is always visible at bottom
  parent.postMessage({type:'ready',panel:'reference'},'*');
  /* WP1: metrics post on stop-change (loadStop) + on request_metrics — not a 2 s interval */
  /* WP3: gate the render loop on visibility + on-screen; render only when dirty/animating */
  document.addEventListener('visibilitychange',()=>{
    visible=document.visibilityState!=='hidden'; if(visible)markDirty();});
  try{const io=new IntersectionObserver(es=>{const on=es[es.length-1].isIntersecting;
      if(on&&!onScreen)markDirty(); onScreen=on;},{threshold:0});
    io.observe(document.getElementById('wrap'));}catch(_){}
  addEventListener('resize',()=>{overlayDirty=true;markDirty();});
  markDirty();   // kick the first frame
}catch(err){document.getElementById('loading').textContent='reference error: '+err;
  console.error(err);} })();
</script>
